    source:
      url: "http://munimap-mapserver?map=/opt/etc/styles/bielefeld/map/mobiel-tag.map&map_resolution=72&"
      format: "image/png"
      layers:
        - route_stations_hull
        - route_segments
        - route_segment_refs
        - route_stations-marker
        - route_stations-text
        - route_stations_centroid-marker
        - route_stations_centroid-text
        - stations-text
        - stations-marker
      srs: "EPSG:25832"
